<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title description">
<title id="title">AI 协作待办名称和图标方案</title>
<desc id="description">JotBaton、CueBaton、JotHandoff 三种名称与图标提案，包含独立应用图标、DEV 示意，以及浅色和深色菜单栏预览。推荐 JotBaton，最终名称尚待选择。</desc>
