<text x="96" y="492" font-size="34" font-weight="750" fill="#1F2338">JotBaton</text>
<text x="96" y="528" font-size="18" font-weight="500" fill="#4338CA">随手记下，交棒给 AI。</text>
<text x="96" y="566" font-size="15" fill="#646B80">Jot 是随手记，Baton 是接力棒。</text>
<text x="96" y="591" font-size="15" fill="#646B80">用简短的名字表达从想法到行动的交接。</text>
