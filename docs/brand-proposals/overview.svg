<text x="64" y="117" font-size="39" font-weight="750" fill="#1F2338">把想法，接着做。</text>
<text x="64" y="157" font-size="18" fill="#646B80">随手记录想法与反馈，带着上下文交给 AI，做完就清掉。</text>
<text x="64" y="199" font-size="13" letter-spacing="1" fill="#646B80">CAPTURE  →  COLLECT  →  HAND OFF  →  COMPLETE</text>
