name: Copy release signing identity to MacSync
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure the same production identity in MacSync Secrets
        env:
          GH_TOKEN: ${{ secrets.MACSYNC_SECRET_TRANSFER_TOKEN }}
          SOURCE_P12: ${{ secrets.REMARC_SIGNING_P12_BASE64 }}
          SOURCE_PASSWORD: ${{ secrets.REMARC_SIGNING_P12_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          for source, destination in [
              ('SOURCE_P12', 'MACSYNC_SIGNING_P12_BASE64'),
              ('SOURCE_PASSWORD', 'MACSYNC_SIGNING_P12_PASSWORD'),
          ]:
              value = os.environ.get(source, '')
              if not value or not os.environ.get('GH_TOKEN'):
                  raise SystemExit('Required signing/transfer credential is missing')
              result = subprocess.run(
                  ['gh', 'secret', 'set', destination, '--repo', 'handsomeliuyang/MacSync'],
                  input=value, text=True, capture_output=True,
              )
              if result.returncode:
                  raise SystemExit('Unable to configure destination signing secret')
          print('MacSync production signing secrets configured without exporting private material')
          PY
