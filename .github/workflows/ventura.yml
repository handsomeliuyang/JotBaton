name: Ventura Intel

on:
  workflow_call:
    secrets:
      REMARC_SIGNING_P12_BASE64:
        required: false
      REMARC_SIGNING_P12_PASSWORD:
        required: false
    inputs:
      source_ref:
        required: true
        type: string
      configuration:
        type: string
        default: Release
  workflow_dispatch:
    inputs:
      configuration:
        type: choice
        options: [Debug, Release]
        default: Debug
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/*ventura*'
      - '.github/workflows/ventura.yml'

permissions:
  contents: read

concurrency:
  group: ventura-${{ github.ref }}-${{ inputs.configuration || 'Debug' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      REMARC_SIGNING_P12_BASE64: ${{ secrets.REMARC_SIGNING_P12_BASE64 }}
      REMARC_SIGNING_P12_PASSWORD: ${{ secrets.REMARC_SIGNING_P12_PASSWORD }}
      REMARC_APP_NAME: ${{ (inputs.configuration || 'Debug') == 'Debug' && 'Remarc Dev' || 'Remarc' }}
      REMARC_CHANNEL: ${{ (inputs.configuration || 'Debug') == 'Debug' && 'development' || 'production' }}
      REMARC_VENTURA: '1'
      REMARC_BUILD_CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Build and launch Ventura app
        run: bash scripts/build-ventura.sh
      - name: Package app
        run: |
          mkdir -p build/ventura
          ditto -c -k --sequesterRsrc --keepParent \
            "app/DerivedData/Build/Products/$REMARC_BUILD_CONFIGURATION/$REMARC_APP_NAME.app" "build/ventura/$REMARC_APP_NAME-Ventura-x86_64.zip"
          cd build/ventura
          shasum -a 256 "$REMARC_APP_NAME-Ventura-x86_64.zip" > SHA256SUMS
      # Intel hosted VMs lack a usable Metal device for Core Image tests.
      # Run keyboard/toast/backend behavior here; the full suite runs below.
      - name: Run compatibility behavior tests on Intel
        run: |
          cd app/RemarcPackage
          env -u THREADS_ACCESS_TOKEN swift test --filter VenturaCompatibilityTests
      - name: Test packaged MCP image delivery
        run: node scripts/smoke-mcp-images.mjs "app/DerivedData/Build/Products/$REMARC_BUILD_CONFIGURATION/$REMARC_APP_NAME.app/Contents/Resources/remarc-mcp.js" "$REMARC_CHANNEL"
      - name: Upload app
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ (inputs.configuration || 'Debug') == 'Debug' && 'Remarc-Dev-Ventura-x86_64' || 'Remarc-Ventura-x86_64' }}
          path: build/ventura/
          if-no-files-found: warn
          retention-days: 14

  package-tests:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, ventura]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      REMARC_VENTURA: ${{ matrix.profile == 'ventura' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Run full Swift suite
        run: |
          cd app/RemarcPackage
          bash ../../scripts/resolve-packages.sh "$(pwd)"
          env -u THREADS_ACCESS_TOKEN swift test
