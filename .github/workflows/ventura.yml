name: Ventura Intel

on:
  workflow_call:
    secrets:
      REMARC_SIGNING_P12_BASE64:
        required: false
      REMARC_SIGNING_P12_PASSWORD:
        required: false
    inputs:
      source_ref:
        required: true
        type: string
      configuration:
        type: string
        default: Release
      # Quick development previews only. Release keeps the default and runs every suite.
      skip_tests:
        type: boolean
        default: false
      full_suites_in_apple_silicon_build:
        description: 'Release runs both full suites on its existing ARM build runner'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      configuration:
        type: choice
        options: [Debug, Release]
        default: Debug

permissions:
  contents: read

concurrency:
  group: ventura-${{ github.ref }}-${{ inputs.configuration || 'Debug' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      REMARC_SIGNING_P12_BASE64: ${{ secrets.REMARC_SIGNING_P12_BASE64 }}
      REMARC_SIGNING_P12_PASSWORD: ${{ secrets.REMARC_SIGNING_P12_PASSWORD }}
      REMARC_APP_NAME: ${{ (inputs.configuration || 'Debug') == 'Debug' && 'Remarc Dev' || 'Remarc' }}
      REMARC_CHANNEL: ${{ (inputs.configuration || 'Debug') == 'Debug' && 'development' || 'production' }}
      REMARC_VENTURA: '1'
      REMARC_BUILD_CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Build and launch Ventura app
        run: bash scripts/build-ventura.sh
      - name: Package app
        run: |
          mkdir -p build/ventura
          ditto -c -k --sequesterRsrc --keepParent \
            "app/DerivedData/Build/Products/$REMARC_BUILD_CONFIGURATION/$REMARC_APP_NAME.app" "build/ventura/$REMARC_APP_NAME-Ventura-x86_64.zip"
          cd build/ventura
          shasum -a 256 "$REMARC_APP_NAME-Ventura-x86_64.zip" > SHA256SUMS
      # Intel hosted VMs lack a usable Metal device for Core Image tests.
      # Run keyboard/toast/backend behavior here; the full suite runs below.
      - name: Run compatibility behavior tests on Intel
        if: ${{ inputs.skip_tests != true }}
        run: |
          cd app/RemarcPackage
          env -u THREADS_ACCESS_TOKEN swift test --cache-path "$(cd .. && pwd)/DerivedData/PackageCache" --filter VenturaCompatibilityTests
      - name: Upload app
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ (inputs.configuration || 'Debug') == 'Debug' && 'Remarc-Dev-Ventura-x86_64' || 'Remarc-Ventura-x86_64' }}
          path: build/ventura/
          if-no-files-found: warn
          retention-days: 14

  package-tests:
    if: ${{ inputs.skip_tests != true && inputs.full_suites_in_apple_silicon_build != true }}
    # arm64 supplies Metal for the complete suite; Xcode remains pinned below.
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, ventura]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      REMARC_VENTURA: ${{ matrix.profile == 'ventura' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Run full Swift suite
        run: |
          python3 -B -m unittest discover -s tests/architecture -v
          cd app/RemarcPackage
          bash ../../scripts/resolve-packages.sh "$(pwd)"
          env -u THREADS_ACCESS_TOKEN swift test --cache-path "$(cd .. && pwd)/DerivedData/PackageCache"
