name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New semantic version (for example, 1.2.5)'
        required: true
        type: string
      build_number:
        description: 'Positive integer higher than the previous release'
        required: true
        type: string
      release_notes:
        description: 'Release notes for both Intel and Apple Silicon packages'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: remarc-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.version.outputs.source_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      NOTES: ${{ inputs.release_notes }}
    steps:
      - name: Require this fork and main
        run: |
          test "$GITHUB_REPOSITORY" = handsomeliuyang/Remarc
          test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main
      - name: Test release and local build policies
        run: |
          python3 -B scripts/test-fork-release.py
          python3 -B scripts/test-build-policy.py
      - name: Test browser extension
        run: |
          node --test tests/extension/*.test.mjs
          for file in extension/*.js extension/*.mjs; do
            node --check "$file"
          done
          python3 -m json.tool extension/manifest.json >/dev/null
      - name: Validate and commit the release version
        id: version
        run: |
          set -euo pipefail
          python3 scripts/prepare-fork-release.py
          TAG="v$VERSION"
          # Fail on API errors rather than interpreting them as absence.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags.txt"
          if grep -Fxq "$TAG" "$RUNNER_TEMP/release-tags.txt"; then
            echo "Release $TAG already exists; inspect it instead of overwriting it" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"
            git diff --exit-code -- app/Config/Shared.xcconfig
          fi
          git config user.name "liuyang"
          git config user.email 40610243@qq.com
          git add app/Config/Shared.xcconfig
          if ! git diff --cached --quiet; then
            git commit -m "Release $TAG"
            git push origin HEAD:refs/heads/main
          fi
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ventura:
    needs: prepare
    secrets:
      REMARC_SIGNING_P12_BASE64: ${{ secrets.REMARC_SIGNING_P12_BASE64 }}
      REMARC_SIGNING_P12_PASSWORD: ${{ secrets.REMARC_SIGNING_P12_PASSWORD }}
    uses: ./.github/workflows/ventura.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}
      configuration: Release

  apple-silicon:
    needs: prepare
    secrets:
      REMARC_SIGNING_P12_BASE64: ${{ secrets.REMARC_SIGNING_P12_BASE64 }}
      REMARC_SIGNING_P12_PASSWORD: ${{ secrets.REMARC_SIGNING_P12_PASSWORD }}
    uses: ./.github/workflows/apple-silicon.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}

  publish:
    needs: [prepare, ventura, apple-silicon]
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      NOTES: ${{ inputs.release_notes }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Remarc-Ventura-x86_64
          path: build/downloads/intel
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Remarc-Apple-Silicon-arm64
          path: build/downloads/arm64
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Verify both downloaded packages and prepare release assets
        run: python3 scripts/verify-fork-release.py
      - name: Tag, upload draft and verify before publishing
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          git config user.name "liuyang"
          git config user.email 40610243@qq.com
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"
          else
            git tag -a "$TAG" "$SOURCE_SHA" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          notes = os.environ['NOTES'].strip()
          sha = os.environ['SOURCE_SHA']
          version = os.environ['VERSION']
          build = os.environ['BUILD_NUMBER']
          repo = os.environ['GITHUB_REPOSITORY']
          notes += f'\n\nVersion: {version} ({build}) · Source: `{sha}`\n\n'
          notes += '| Package | Target |\n|---|---|\n'
          notes += '| `Remarc-Ventura-x86_64.zip` | 黑苹果 / Intel，macOS 13+ |\n'
          notes += '| `Remarc-Apple-Silicon-arm64.dmg` | Apple Silicon，macOS 14+ |\n\n'
          notes += '两个安装包均为 Release 配置，使用同一源码提交。附带 SHA256SUMS 和安装说明。\n\n'
          notes += '两个安装包使用同一固定私有发布证书签名，未经过 Apple 公证；首次打开可能需要允许运行并重新授权。'
          notes += '直接替换安装，无需本机重新签名。Remarc Dev 与正式版的数据及 iCloud 目录独立。正式版从本仓库 GitHub Releases 检查新版本，并打开对应架构的安装包链接供手动安装；测试版保持独立。\n\n'
          notes += f'[安装与发布说明](https://github.com/{repo}/blob/v{version}/RELEASING.md)\n'
          Path('build/release-notes.md').write_text(notes)
          PY
          gh release create "$TAG" build/release/* --draft --verify-tag \
            --title "Remarc $TAG — Intel + Apple Silicon" --notes-file build/release-notes.md
          gh release view "$TAG" --json assets,isDraft,body > build/draft.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('build/draft.json').read_text())
          expected = {p.name: p.stat().st_size for p in Path('build/release').iterdir()}
          actual = {a['name']: a['size'] for a in release['assets']}
          assert release['isDraft'] and actual == expected, (actual, expected)
          assert release['body'].strip() == Path('build/release-notes.md').read_text().strip()
          PY
          gh release download "$TAG" --dir build/draft-verified
          (cd build/draft-verified && shasum -a 256 -c SHA256SUMS)
          for asset in build/release/*; do
            cmp "$asset" "build/draft-verified/$(basename "$asset")"
          done
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json isDraft,url --jq 'if .isDraft then error("Still a draft") else .url end'
          gh release download "$TAG" --dir build/published-verified
          (cd build/published-verified && shasum -a 256 -c SHA256SUMS)
          for asset in build/release/*; do
            cmp "$asset" "build/published-verified/$(basename "$asset")"
          done
